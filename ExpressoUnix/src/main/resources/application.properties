
# MySQL Driver configs
spring.application.name=ExpressoUnix
spring.datasource.url=jdbc:mysql://localhost:3306/expresso-unix?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true 
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Venda: exige que a origem da volta seja o destino da ida (decisao em aberto 4 do pdv-features.md)
expressounix.venda.volta-origem-igual-destino-ida=true
